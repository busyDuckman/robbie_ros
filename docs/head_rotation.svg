<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" width="640" height="720" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>head.rotation_deg: zero and positive direction on the platform, viewed from above</title>
  <rect width="640" height="720" fill="#ffffff"/>

  <!-- Scale: 3.5 px per mm. Centre (300, 300). Viewed from above: +X right, +Y up. -->

  <!-- Sled pivot circle (below the platform), r = 43 mm -->
  <circle cx="300" cy="300" r="150.5" fill="none" stroke="#bbb" stroke-dasharray="2 4"/>

  <!-- Platform: hexagon, apothem 34 mm; the rod ends sit outside it, at 40 mm -->
  <polygon points="437.4,300 368.7,181 231.3,181 162.6,300 231.3,419 368.7,419"
           fill="#eef2f7" stroke="#445" stroke-width="2"/>

  <!-- Nod lines: halfway round the twist between each sled pivot and its rod's top pivot (jam-dependent) -->
  <g stroke="#b8860b" stroke-width="1.5" stroke-dasharray="1 4" stroke-linecap="round">
    <line x1="300" y1="300" x2="431.6" y2="136.3"/>
    <line x1="300" y1="300" x2="92.5" y2="267.9"/>
    <line x1="300" y1="300" x2="375.9" y2="495.8"/>
  </g>
  <text x="436" y="130" fill="#8a6508" font-size="11">nod line, at −jam/2 ≈ −38.8°</text>

  <!-- Zero line: platform centre to rod end 1 -->
  <g fill="#c0392b" stroke="#c0392b">
    <line x1="300" y1="300" x2="300" y2="64" stroke-width="2.5"/>
    <polygon points="300,52 294,64 306,64" stroke="none"/>
  </g>
  <text x="308" y="58" fill="#c0392b" font-weight="bold">0°: centre → rod end 1</text>

  <!-- Positive rotation: CCW seen from above -->
  <path d="M300,38 A262,262 0 0 0 131.6,99.3" fill="none" stroke="#1f6fb2" stroke-width="2.5"/>
  <polygon points="123.9,105.7 135.5,103.9 127.7,94.7" fill="#1f6fb2"/>
  <text x="150" y="58" fill="#1f6fb2" font-weight="bold">+ CCW</text>

  <!-- Example head facing, +20 deg -->
  <g fill="#555" stroke="#555">
    <line x1="300" y1="300" x2="237.6" y2="128.5" stroke-width="2"/>
    <polygon points="234.2,119.1 243.2,126.4 232.0,130.6" stroke="none"/>
  </g>
  <text x="78" y="136" fill="#555">head at +20° (example)</text>

  <!-- Rods seen from above, down to their sleds (drawn for a CCW twist, jam 77.6 deg) -->
  <g stroke="#888" stroke-width="2" stroke-dasharray="6 4" fill="none">
    <line x1="300" y1="160" x2="446.99" y2="267.68"/>
    <line x1="178.76" y1="370" x2="198.52" y2="188.86"/>
    <line x1="421.24" y1="370" x2="254.49" y2="443.46"/>
  </g>
  <g fill="#fff" stroke="#888" stroke-width="1.5">
    <circle cx="446.99" cy="267.68" r="5"/>
    <circle cx="198.52" cy="188.86" r="5"/>
    <circle cx="254.49" cy="443.46" r="5"/>
  </g>
  <g fill="#777" font-size="11">
    <text x="458" y="272">sled 1 pivot (below)</text>
    <text x="116" y="186">sled 2 pivot</text>
    <text x="214" y="482">sled 3 pivot</text>
  </g>

  <!-- Rod ends: radial screw out of the midpoint of every second edge, through the rod-end eye -->
  <g stroke="#222" stroke-width="3" stroke-linecap="round">
    <line x1="300" y1="181" x2="300" y2="146"/>
    <line x1="196.9" y1="359.5" x2="166.6" y2="377"/>
    <line x1="403.1" y1="359.5" x2="433.4" y2="377"/>
  </g>
  <g fill="#1f6fb2" stroke="#fff" stroke-width="1.5">
    <circle cx="300" cy="160" r="7"/>
    <circle cx="178.76" cy="370" r="7"/>
    <circle cx="421.24" cy="370" r="7"/>
  </g>
  <g font-weight="bold" fill="#222">
    <text x="312" y="152">rod end 1</text>
    <text x="92" y="400">rod end 2</text>
    <text x="436" y="400">rod end 3</text>
  </g>

  <circle cx="300" cy="300" r="4" fill="#222"/>
  <text x="308" y="318" fill="#222" font-size="11">platform centre</text>

  <!-- Caption -->
  <g fill="#222">
    <text x="24" y="560" font-weight="bold" font-size="15">head.rotation_deg (neck.yaml), viewed from above</text>
    <text x="24" y="586">The platform is a hexagon with a rod end outside the midpoint of every second edge.</text>
    <text x="24" y="606">0° is the line from the platform centre to rod end 1 (the rod from sled 1).</text>
    <text x="24" y="626">Positive is CCW seen from above. The head's forward axis is rotated by this</text>
    <text x="24" y="646">angle, and roll and pitch are reported in the head's frame.</text>
    <text x="24" y="672" fill="#777" font-size="11">Dashed: rods seen from above, drawn for a CCW twist at jam 77.6°. Dotted: nod lines, which</text>
    <text x="24" y="688" fill="#777" font-size="11">move with the jam, so they aren't used as the zero. Rod end 1 is fixed on the part, whatever the jam.</text>
  </g>
</svg>
